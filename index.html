<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Live Sprach-Übersetzer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="trans.png">
    <link rel="apple-touch-icon" href="trans.png">
</head>
<body>
    <div class="container">
        <h1>🎤 Live Sprach-Übersetzer</h1>

        <div class="language-selector">
            <div class="selector-group">
                <label>Von:</label>
                <select id="sourceLanguage">
                    <option value="de-DE">🇩🇪 Deutsch</option>
                    <option value="en-US">🇺🇸 English</option>
                    <option value="es-ES">🇪🇸 Español</option>
                    <option value="fr-FR">🇫🇷 Français</option>
                    <option value="it-IT">🇮🇹 Italiano</option>
                    <option value="sv-SE">🇸🇪 Svenska</option>
                    <option value="nb-NO">🇳🇴 Norsk</option>
                    <option value="pl-PL">🇵🇱 Polski</option>
                </select>
            </div>

            <div class="selector-group">
                <label>Nach:</label>
                <select id="targetLanguage">
                    <option value="de">🇩🇪 Deutsch</option>
                    <option value="en" selected>🇺🇸 English</option>
                    <option value="es">🇪🇸 Español</option>
                    <option value="fr">🇫🇷 Français</option>
                    <option value="it">🇮🇹 Italiano</option>
                    <option value="sv">🇸🇪 Svenska</option>
                    <option value="no">🇳🇴 Norsk</option>
                    <option value="pl">🇵🇱 Polski</option>
                </select>
            </div>
        </div>

        <!-- Sprachausgabe Toggle -->
        <div class="speech-toggle">
            <label class="toggle-label">
                <input type="checkbox" id="speechToggle" checked>
                <span class="toggle-slider"></span>
                <span class="toggle-text">🔊 Übersetzung vorlesen</span>
            </label>
        </div>

        <!-- Text-Eingabe -->
        <div class="text-input-section">
            <label for="textInput">📝 Text eingeben:</label>
            <div class="input-group">
                <textarea id="textInput" placeholder="Text hier eingeben zum Übersetzen..."></textarea>
                <button id="translateBtn" class="btn-translate">🌍 Übersetzen</button>
            </div>
        </div>

        <!-- Mikrofon-Steuerung -->
        <div class="controls">
            <button id="startBtn" class="btn btn-start">🎤 Mikrofon Start</button>
            <button id="stopBtn" class="btn btn-stop" disabled>⏹ Mikrofon Stop</button>
        </div>

        <div class="status" id="status">Bereit zum Übersetzen</div>

        <div class="output-container">
            <div class="output-box">
                <h3>🗣️ Erkannt / Eingegeben:</h3>
                <div id="recognized" class="text-output">Hier erscheint der erkannte oder eingegebene Text...</div>
            </div>

            <div class="output-box">
                <h3>🌍 Übersetzung:</h3>
                <div id="translated" class="text-output">Hier erscheint die Übersetzung...</div>
                <button id="repeatBtn" class="btn-repeat" style="display: none;">🔊 Wiederholen</button>
            </div>
        </div>

        <div class="info">
            <p>💡 <strong>Tipp:</strong> Nutze Mikrofon ODER tippe Text manuell ein!</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
